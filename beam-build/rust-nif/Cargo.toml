# standalone — not part of the kernel's cargo workspace
[workspace]

[package]
name = "tyn_rust_nif"
version = "0.1.0"
edition = "2021"

# staticlib -> a .a archive linked into beam.smp via --enable-static-nifs.
# This is the Rust confirmation of the static-NIF spike (CRYPTO_NIF.md Step 1)
# and the shape the real Rust crypto NIF (Option A) will take.
[lib]
name = "tyn_rust_nif"
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
opt-level = 2
